version: "2"
run:
  concurrency: 4
  issues-exit-code: 2
  tests: true
  modules-download-mode: vendor
  relative-path-mode: gomod
  timeout: 10m
  # Route hashicorp/go-metrics/compat (pulled in via memberlist) through
  # github.com/hashicorp/go-metrics instead of the deprecated armon fallback.
  build-tags:
    - hashicorpmetrics
output:
  path-prefix: ""
linters:
  default: none
  enable:
    - gocyclo
    - gosec
    - misspell
    - revive
    - staticcheck
    - whitespace
    - govet
    - goheader
  settings:
    gosec:
      excludes:
        - G115
        - G602
    misspell:
      # Codebase uses British spellings throughout. The locale is US so
      # misspell flags American forms as the "correct" target, and the
      # ignore-rules below list the British forms we want to keep. Add
      # every inflection of a verb (root, third-person, past, gerund) so
      # comments like "the queue is signalled" or "amortises the cost"
      # are not flagged.
      locale: US
      ignore-rules:
        # cancel
        - cancelled
        - cancelling
        # behaviour / behave
        - behaviour
        - behaviours
        - behavioural
        # initialise
        - initialise
        - initialised
        - initialises
        - initialising
        # materialise
        - materialise
        - materialised
        - materialises
        - materialising
        - materialisation
        - serialisation
        - recognisable
        # amortise
        - amortise
        - amortised
        - amortises
        - amortising
        # maximise / minimise
        - maximise
        - maximised
        - maximises
        - maximising
        - minimise
        - minimised
        - minimises
        - minimising
        # signal (double-l British past/gerund)
        - signalled
        - signalling
        # serialise / deserialise (often appear in messaging/IO comments)
        - serialise
        - serialised
        - serialises
        - serialising
        - deserialise
        - deserialised
        - deserialises
        - deserialising
        # organise / synchronise — common in concurrency comments
        - organise
        - organised
        - organises
        - organising
        - synchronise
        - synchronised
        - synchronises
        - synchronising
        - synchronisation
    revive:
      enable-all-rules: false
      enable-default-rules: true
      rules:
        - name: var-naming
          arguments:
            - [] # allowlist for initialisms
            - [] # blocklist for initialisms
            - [{ skipPackageNameChecks: true }]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: _test\.go
        text: context.Context should be the first parameter of a function
      - linters:
          - revive
        path: _test\.go
        text: exported func.*returns unexported type.*which can be annoying to use
      - linters:
          - revive
        text: ".*stutters.*"
      - linters:
          - revive
        text: "unused-parameter:"
    paths:
      - mocks
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - mocks
      - third_party$
      - builtin$
      - examples$